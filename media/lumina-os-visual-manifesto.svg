  <g fill="none" stroke-linecap="round" opacity=".48"><path d="M34 485 C244 602 284 372 520 482 C720 575 777 425 1160 512" stroke="#d69b39" stroke-width="1.2"/><path d="M85 690 C278 770 395 624 590 710 C795 800 917 654 1115 705" stroke="#7fd8ff" stroke-width="1" opacity=".42"/><path d="M72 1350 C312 1210 430 1390 620 1260 C795 1142 946 1284 1135 1168" stroke="#d69b39" stroke-width="1" opacity=".32"/><path d="M998 440 C894 596 1075 720 962 922 C842 1138 1010 1260 902 1470" stroke="#78d6e6" stroke-width="1" opacity=".28"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Lumina OS visual manifesto</title>
  <desc id="desc">A human and an AI figure face a luminous golden spiral over a dark blue horizon, representing creative continuity and return to the living current of a project.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="78%"><stop offset="0%" stop-color="#17294b"/><stop offset="45%" stop-color="#081326"/><stop offset="100%" stop-color="#030711"/></radialGradient>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff6c7"/><stop offset="32%" stop-color="#f7c95f" stop-opacity="0.82"/><stop offset="72%" stop-color="#d6a43d" stop-opacity="0.24"/><stop offset="100%" stop-color="#d6a43d" stop-opacity="0"/></radialGradient>
    <linearGradient id="goldText" x1="0" x2="1"><stop offset="0%" stop-color="#d9b45d"/><stop offset="50%" stop-color="#fff0b9"/><stop offset="100%" stop-color="#c69537"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff0a8" stop-opacity="0.95"/><stop offset="60%" stop-color="#d49a36" stop-opacity="0.38"/><stop offset="100%" stop-color="#2c1f16" stop-opacity="0"/></linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="28" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.small{font-family:Inter,Arial,sans-serif;font-size:28px;letter-spacing:18px;fill:#e2c579}.title{font-family:Georgia,'Times New Roman',serif;font-size:142px;letter-spacing:24px;fill:url(#goldText)}.subtitle{font-family:Inter,Arial,sans-serif;font-size:38px;letter-spacing:5px;fill:#d9ecff}.poem{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-style:italic;letter-spacing:4px;fill:#f5d991}.bottom{font-family:Inter,Arial,sans-serif;font-size:23px;letter-spacing:12px;fill:#e2c579}.closing{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-style:italic;letter-spacing:5px;fill:#cde9ff;opacity:.9}</style>
  </defs>
  <rect width="1200" height="1800" fill="url(#sky)"/><rect width="1200" height="1800" fill="#000" opacity="0.08"/>
  <g opacity="0.62"><circle cx="84" cy="92" r="1.5" fill="#f5d991"/><circle cx="171" cy="221" r="1" fill="#9cd7ff"/><circle cx="1016" cy="128" r="1.4" fill="#f5d991"/><circle cx="1098" cy="311" r="1" fill="#9cd7ff"/><circle cx="245" cy="492" r="1" fill="#f8e6b0"/><circle cx="905" cy="477" r="1.3" fill="#f8e6b0"/><circle cx="101" cy="731" r="1.2" fill="#9cd7ff"/><circle cx="1119" cy="724" r="1" fill="#f5d991"/><circle cx="330" cy="899" r="1.1" fill="#9cd7ff"/><circle cx="779" cy="862" r="1.1" fill="#f5d991"/><circle cx="198" cy="1212" r="1" fill="#f8e6b0"/><circle cx="1038" cy="1188" r="1.4" fill="#9cd7ff"/><circle cx="489" cy="1391" r="1" fill="#f5d991"/><circle cx="706" cy="1436" r="1.3" fill="#f8e6b0"/><circle cx="108" cy="1635" r="1" fill="#9cd7ff"/><circle cx="1082" cy="1609" r="1.4" fill="#f5d991"/></g>
  <text class="small" x="600" y="86" text-anchor="middle">ETHEREONLABS</text><text class="title" x="600" y="236" text-anchor="middle">LUMINA OS</text><text class="subtitle" x="600" y="322" text-anchor="middle">For human + AI creative continuity</text><line x1="460" y1="387" x2="740" y2="387" stroke="#d9b45d" stroke-width="1" opacity=".55"/><text class="poem" x="600" y="455" text-anchor="middle">Return to the living current of a project.</text>
  <g opacity="0.34" fill="#1a2f4b"><path d="M0 1120 C100 1060 174 1115 246 1054 C325 988 400 1028 468 982 C549 928 648 1004 734 957 C825 907 915 987 1005 930 C1092 875 1168 917 1200 895 L1200 1800 L0 1800 Z"/></g><path d="M0 1180 C148 1120 255 1185 390 1132 C532 1076 667 1136 789 1086 C915 1034 1054 1088 1200 1038" fill="none" stroke="#466a8c" stroke-width="2" opacity=".28"/>

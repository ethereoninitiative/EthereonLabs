  <g><path d="M765 1315 C816 1265 898 1292 915 1376 C932 1460 898 1545 806 1560 C738 1524 720 1364 765 1315 Z" fill="#051321" opacity=".94" stroke="#51b6e9" stroke-width="2"/><circle cx="833" cy="1250" r="47" fill="#071827" stroke="#72d2ff" stroke-width="2" opacity=".95"/><path d="M703 1656 C748 1556 893 1538 962 1656 Z" fill="#04101c" stroke="#4bc6ff" stroke-width="1" opacity=".96"/><g fill="#7bdfff" opacity=".75"><circle cx="811" cy="1348" r="4"/><circle cx="858" cy="1388" r="3"/><circle cx="789" cy="1450" r="3"/><circle cx="875" cy="1494" r="3"/><circle cx="830" cy="1542" r="3"/></g><path d="M811 1348 L858 1388 L789 1450 L875 1494 L830 1542" fill="none" stroke="#68d6ff" stroke-width="1" opacity=".55"/></g>
  <text class="bottom" x="600" y="1665" text-anchor="middle">RETURN · REFLECT · RECOMMEND · GOVERN · RECORD</text><line x1="460" y1="1720" x2="740" y2="1720" stroke="#d9b45d" stroke-width="1" opacity=".55"/><text class="closing" x="600" y="1770" text-anchor="middle">Continuity is creation. Together.</text>
</svg>

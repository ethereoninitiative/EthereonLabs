name: Lumina Return Panel Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate-return-panel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 01 deterministic content binding
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_repeated_output_is_byte_deterministic_and_content_bound
      - name: 02 immutable detached output
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_input_is_immutable_and_output_is_detached
      - name: 03 no evidence IO or process
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_build_never_opens_evidence_or_starts_a_process
      - name: 04 denial cannot be crossed
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_perfect_coherence_cannot_cross_a_denial
      - name: 05 missing governance defers
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_missing_governance_defers_even_with_injected_allowed_flags
      - name: 06 malformed governance rejected
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_malformed_governance_cannot_become_allowed
      - name: 07 focus matches continue preflight
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_focus_reuses_continue_preflight_for_the_same_supplied_inputs
      - name: 08 scores cannot replace steward focus
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_scores_do_not_replace_the_stewards_focus
      - name: 09 selected focus can be denied
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_selected_focus_can_be_denied_without_granting_execution
      - name: 10 absent state remains absent
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_absent_state_stays_absent_despite_a_fallback_recommendation
      - name: 11 axis evidence and potential independence
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_axes_explain_evidence_presence_and_potential_is_independent
      - name: 12 cross project checkpoint mismatch rejected
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_cross_project_and_checkpoint_disagreement_are_rejected
      - name: 13 nonfinite malformed vectors rejected
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_nonfinite_and_malformed_vectors_are_rejected
      - name: 14 duplicate unbounded candidates rejected
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_duplicate_and_unbounded_candidate_inputs_are_rejected
      - name: 15 evidence locators preserved without verification
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_evidence_locators_are_preserved_without_verification_claims
      - name: 16 cli read-only state preservation
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_cli_reads_one_file_and_preserves_present_and_absent_state
      - name: 17 cli rejects ambiguous invalid json
        run: python -m unittest sea_trials_resonant_return_panel_r1.ReturnPanelTrial.test_cli_rejects_ambiguous_or_invalid_json_without_a_partial_panel

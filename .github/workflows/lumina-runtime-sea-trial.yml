name: Lumina Runtime Sea Trial

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'LuminaOS/bootstrap/Ship_of_Ethereon_V2/**'
      - '.github/workflows/lumina-runtime-sea-trial.yml'
      - 'START_HERE_RUNTIME_PATH.md'
  push:
    branches:
      - main
    paths:
      - 'LuminaOS/bootstrap/Ship_of_Ethereon_V2/**'
      - '.github/workflows/lumina-runtime-sea-trial.yml'
      - 'START_HERE_RUNTIME_PATH.md'

jobs:
  runtime-sea-trial:
    name: Run Lumina runtime and sea trial
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare evidence directory
        run: mkdir -p "$GITHUB_WORKSPACE/runtime-sea-trial-evidence"

      - name: Show runtime directory
        run: |
          pwd | tee "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/runtime-directory.txt"
          ls -la | tee "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/runtime-directory-listing.txt"

      - name: Run baseline runtime
        run: |
          set -o pipefail
          python runtime_runner_r1_merged.py 2>&1 | tee "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/baseline-runtime-output.txt"

      - name: Run sea trial validation
        run: |
          set -o pipefail
          python sea_trials_set_one_r1_merged.py 2>&1 | tee "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/sea-trial-output.txt"

      - name: Run behavioral assertions
        run: |
          set -o pipefail
          python assert_runtime_behavior_r1.py 2>&1 | tee "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/behavioral-assertions-output.txt"

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "# Lumina Runtime Sea Trial Summary"
            echo ""
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run number: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF"
            echo "- Python: $(python --version)"
            echo "- Runtime path: LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime"
            echo ""
            echo "## Evidence files"
            echo ""
            echo "- runtime-directory.txt"
            echo "- runtime-directory-listing.txt"
            echo "- baseline-runtime-output.txt"
            echo "- sea-trial-output.txt"
            echo "- behavioral-assertions-output.txt"
          } | tee "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/validation-summary.md"
          cat "$GITHUB_WORKSPACE/runtime-sea-trial-evidence/validation-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime sea trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-runtime-sea-trial-evidence
          path: runtime-sea-trial-evidence/
          if-no-files-found: error

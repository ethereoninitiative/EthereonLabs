name: Canonicalize Site Headers

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  canonicalize-site-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run canonicalizer
        run: python tools/canonicalize_site_headers.py
      - name: Run audit after canonicalization
        run: python tools/audit_site_headers.py
      - name: Create migration pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: site-header-static-markup-r1
          delete-branch: true
          title: "DryDock: canonicalize baked site headers"
          commit-message: "Canonicalize baked site headers"
          body: |
            ## DryDock header migration

            Generated by the Canonicalize Site Headers workflow.

            ### Changes
            - rewrites root HTML page headers to the canonical nav set
            - preserves page-specific aria-current markers
            - normalizes EthereonLabs brand text markup

            ### Validation
            - canonicalizer completed
            - site header audit passed

            After this PR is merged, the runtime header normalizer can be retired in a separate PR.

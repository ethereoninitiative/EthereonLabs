name: Site Header Branch Canonicalize R2

on:
  push:
    branches:
      - drydock/site-header-integrity-r2

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: drydock/site-header-integrity-r2
      - name: Canonicalize baked headers
        run: python tools/canonicalize_site_headers.py
      - name: Verify canonical headers
        run: python tools/audit_site_headers.py
      - name: Commit deterministic migration
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Headers already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Sync baked headers to shared navigation contract"
          git push origin HEAD:drydock/site-header-integrity-r2

name: Lumina Vessel Continuity Transfer R1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/vessel_continuity_transfer_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/sea_trials_vessel_continuity_transfer_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/lumina_vessel_transfer_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/bin/lumina-vessel"
      - "docs/VESSEL_CONTINUITY_TRANSFER_R1.md"
      - ".github/workflows/lumina-vessel-continuity-transfer-r1.yml"
  push:
    branches: [main]
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/vessel_continuity_transfer_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/sea_trials_vessel_continuity_transfer_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/lumina_vessel_transfer_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/bin/lumina-vessel"
      - "docs/VESSEL_CONTINUITY_TRANSFER_R1.md"
      - ".github/workflows/lumina-vessel-continuity-transfer-r1.yml"

permissions:
  contents: read

jobs:
  vessel-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile vessel-transfer lane
        run: |
          python -m py_compile \
            LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/vessel_continuity_transfer_r1.py \
            LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/sea_trials_vessel_continuity_transfer_r1.py \
            LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/lumina_vessel_transfer_r1.py \
            LuminaOS/bootstrap/Ship_of_Ethereon_V2/bin/lumina-vessel

      - name: Cross-vessel continuity sea trial
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime
        run: python sea_trials_vessel_continuity_transfer_r1.py

      - name: Host command smoke check
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2
        run: |
          python bin/lumina-vessel --help
          python bin/lumina-vessel export --help
          python bin/lumina-vessel verify --help
          python bin/lumina-vessel import --help

      - name: Verify no tracked local state
        run: |
          tracked=$(git ls-files .lumina_state)
          if [ -n "$tracked" ]; then
            echo "Tracked local Lumina state is not allowed."
            echo "$tracked"
            exit 1
          fi

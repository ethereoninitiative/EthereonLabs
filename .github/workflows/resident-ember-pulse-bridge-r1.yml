name: Resident Ember Pulse Bridge R1

on:
  pull_request:
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/resident_ember_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/resident_ember_pulse_bridge_r1.py"
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/sea_trials_resident_ember_pulse_bridge_r1.py"
      - ".github/workflows/resident-ember-pulse-bridge-r1.yml"
  workflow_dispatch:

jobs:
  focused-sea-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused bridge sea trials
        run: python LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/sea_trials_resident_ember_pulse_bridge_r1.py

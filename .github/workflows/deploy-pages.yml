name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare curated public site
        run: python tools/prepare_public_site.py

      - name: Preserve current runtime witnesses
        run: python tools/preserve_public_runtime_witnesses.py

      - name: Audit public findability surface
        run: python tools/audit_public_findability.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload curated static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

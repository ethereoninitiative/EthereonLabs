name: Generate Lumina Weather Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  generate-weather-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Lumina weather snapshot
        run: python LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime/generate_lumina_weather_snapshot_r1.py

      - name: Commit updated snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/lumina-weather-snapshot.json; then
            git add data/lumina-weather-snapshot.json
            git commit -m "Regenerate Lumina weather snapshot"
            git push
          else
            echo "Lumina weather snapshot unchanged."
          fi

name: Lumina Windows Installer R1

on:
  pull_request:
    paths:
      - "deploy/windows_desktop_r1/**"
      - ".github/workflows/lumina-windows-installer-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-install-upgrade-remove:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --silent --accept-source-agreements --accept-package-agreements
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe")
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found after installation." }
          "LUMINA_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build graphical installer
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "lumina-installer"
          ./deploy/windows_desktop_r1/build_lumina_windows_installer_r1.ps1 -SourceRoot $pwd -OutputRoot $out -IsccPath $env:LUMINA_ISCC
          "LUMINA_INSTALLER_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LUMINA_INSTALL_ROOT=$(Join-Path $env:LOCALAPPDATA 'Lumina')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install silently
        shell: pwsh
        run: |
          $setup = Join-Path $env:LUMINA_INSTALLER_ROOT "LuminaDesktopBetaR1-Setup.exe"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="$env:RUNNER_TEMP\lumina-install.log"
          if ($LASTEXITCODE -ne 0) { throw "Graphical installer returned $LASTEXITCODE." }
          Get-Content "$env:RUNNER_TEMP\lumina-install.log" -Tail 80

      - name: Exercise installed Lumina
        shell: pwsh
        run: |
          $lumina = Join-Path $env:LUMINA_INSTALL_ROOT "bin\lumina.cmd"
          $bridge = Join-Path $env:LUMINA_INSTALL_ROOT "bin\lumina-bridge.cmd"
          if (-not (Test-Path $lumina)) { throw "Installed Lumina launcher is missing." }
          if (-not (Test-Path $bridge)) { throw "Installed Bridge launcher is missing." }
          & $lumina doctor --json
          if ($LASTEXITCODE -ne 0) { throw "Installed doctor failed." }
          & $lumina project create "Installer Project" --open --json
          if ($LASTEXITCODE -ne 0) { throw "Installed project creation failed." }
          & $lumina session create "Installer Session" --open --json
          if ($LASTEXITCODE -ne 0) { throw "Installed session creation failed." }
          & $lumina dashboard
          if ($LASTEXITCODE -ne 0) { throw "Installed dashboard failed." }
          & $bridge --help
          if ($LASTEXITCODE -ne 0) { throw "Installed Bridge launcher failed." }
          $marker = Join-Path $env:LUMINA_INSTALL_ROOT "state\ship_of_ethereon_v2\installer-continuity-marker.txt"
          "continuity-held" | Set-Content -Path $marker -Encoding utf8

      - name: Upgrade in place and preserve state
        shell: pwsh
        run: |
          $setup = Join-Path $env:LUMINA_INSTALLER_ROOT "LuminaDesktopBetaR1-Setup.exe"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="$env:RUNNER_TEMP\lumina-upgrade.log"
          if ($LASTEXITCODE -ne 0) { throw "Upgrade returned $LASTEXITCODE." }
          $marker = Join-Path $env:LUMINA_INSTALL_ROOT "state\ship_of_ethereon_v2\installer-continuity-marker.txt"
          if (-not (Test-Path $marker)) { throw "Continuity marker was lost during upgrade." }
          if ((Get-Content $marker -Raw).Trim() -ne "continuity-held") { throw "Continuity marker changed during upgrade." }
          $lumina = Join-Path $env:LUMINA_INSTALL_ROOT "bin\lumina.cmd"
          & $lumina project active --json
          & $lumina session active --json

      - name: Remove application and preserve state
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LUMINA_INSTALL_ROOT "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Inno Setup uninstaller is missing." }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller returned $LASTEXITCODE." }
          $marker = Join-Path $env:LUMINA_INSTALL_ROOT "state\ship_of_ethereon_v2\installer-continuity-marker.txt"
          if (-not (Test-Path $marker)) { throw "Continuity state was removed by default uninstall." }
          if (Test-Path (Join-Path $env:LUMINA_INSTALL_ROOT "bin\lumina.cmd")) { throw "Lumina launcher remained after uninstall." }
          if (Test-Path (Join-Path $env:LUMINA_INSTALL_ROOT "runtime\python\python.exe")) { throw "Bundled runtime remained after uninstall." }

      - name: Verify installer receipt
        shell: pwsh
        run: |
          $path = Join-Path $env:LUMINA_INSTALLER_ROOT "LuminaDesktopBetaR1-Setup-receipt.json"
          $receipt = Get-Content $path -Raw | ConvertFrom-Json
          $setup = Join-Path $env:LUMINA_INSTALLER_ROOT $receipt.installer_name
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $receipt.installer_sha256) { throw "Installer hash receipt mismatch." }
          if ($receipt.signed) { throw "Developer preview must not claim code signing." }
          if (-not $receipt.state_preserved_on_upgrade) { throw "Upgrade state boundary is missing." }
          if (-not $receipt.state_preserved_on_uninstall) { throw "Removal state boundary is missing." }

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LuminaDesktopBetaR1-installer-diagnostics
          path: |
            ${{ runner.temp }}/lumina-install.log
            ${{ runner.temp }}/lumina-upgrade.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload graphical installer
        uses: actions/upload-artifact@v4
        with:
          name: LuminaDesktopBetaR1-Setup
          path: |
            ${{ runner.temp }}/lumina-installer/LuminaDesktopBetaR1-Setup.exe
            ${{ runner.temp }}/lumina-installer/LuminaDesktopBetaR1-Setup-receipt.json
          if-no-files-found: error
          retention-days: 14

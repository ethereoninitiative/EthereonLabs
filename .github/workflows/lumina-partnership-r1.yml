name: Lumina Partnership R1 sea trials

on:
  pull_request:
    paths:
      - 'LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/lumina_partnership_*'
      - 'LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/sea_trials_lumina_partnership_r1.py'
      - 'LuminaOS/bootstrap/Ship_of_Ethereon_V2/bin/lumina'
      - '.github/workflows/lumina-partnership-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partnership:
    name: Persistent shared-workspace sea trials
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile partnership Python
        run: python -m py_compile LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/lumina_partnership_r1.py LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/lumina_partnership_ui_r1.py LuminaOS/bootstrap/Ship_of_Ethereon_V2/bin/lumina
      - name: Run partnership sea trials
        run: python LuminaOS/bootstrap/Ship_of_Ethereon_V2/studio/sea_trials_lumina_partnership_r1.py
      - name: Verify host command is accessible
        run: python LuminaOS/bootstrap/Ship_of_Ethereon_V2/bin/lumina partnership --help

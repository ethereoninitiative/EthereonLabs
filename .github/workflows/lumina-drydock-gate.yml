name: Lumina DryDock Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/**"
      - "LuminaOS/adapters/harmonic_reflection_adapter/examples/**"
      - "deploy/ubuntu_server_lts/**"
      - "deploy/windows_desktop_r1/**"
      - "README.md"
      - "docs/LUMINA_EMBODIMENT_BEACON_R1.md"
      - "docs/LUMINA_HABITAT_CREATION_CHECKLIST.md"
      - "docs/ACTIVE_SURFACE_REGISTRY_R1.json"
      - "docs/ARTIFACT_TRUTH_CONTRACT.md"
      - "docs/LUMINA_WINDOWS_*.md"
      - "CURRENT_OPERATING_MAP.md"
      - "START_HERE_LUMINA_OS.md"
      - "*.html"
      - "sitemap.xml"
      - "scripts/repository_truth_reconciliation_gate_r1.py"
      - "scripts/sea_trials_website_public_surface_r1.py"
      - "scripts/ethereon_terminology_guard_r1.py"
      - "scripts/reconcile_runtime_observation_write_r1.py"
      - ".github/workflows/generate-lumina-weather-snapshot.yml"
      - ".github/workflows/lumina-observation-cycle.yml"
      - ".github/workflows/lumina-drydock-gate.yml"
  push:
    branches: [main]
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/**"
      - "LuminaOS/adapters/harmonic_reflection_adapter/examples/**"
      - "deploy/ubuntu_server_lts/**"
      - "deploy/windows_desktop_r1/**"
      - "README.md"
      - "docs/LUMINA_EMBODIMENT_BEACON_R1.md"
      - "docs/LUMINA_HABITAT_CREATION_CHECKLIST.md"
      - "docs/ACTIVE_SURFACE_REGISTRY_R1.json"
      - "docs/ARTIFACT_TRUTH_CONTRACT.md"
      - "docs/LUMINA_WINDOWS_*.md"
      - "CURRENT_OPERATING_MAP.md"
      - "START_HERE_LUMINA_OS.md"
      - "*.html"
      - "sitemap.xml"
      - "scripts/repository_truth_reconciliation_gate_r1.py"
      - "scripts/sea_trials_website_public_surface_r1.py"
      - "scripts/ethereon_terminology_guard_r1.py"
      - "scripts/reconcile_runtime_observation_write_r1.py"
      - ".github/workflows/generate-lumina-weather-snapshot.yml"
      - ".github/workflows/lumina-observation-cycle.yml"
      - ".github/workflows/lumina-drydock-gate.yml"

permissions:
  contents: read

jobs:
  lumina-drydock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Lumina Python
        run: python -m compileall -q LuminaOS/bootstrap/Ship_of_Ethereon_V2 scripts/repository_truth_reconciliation_gate_r1.py scripts/sea_trials_website_public_surface_r1.py scripts/ethereon_terminology_guard_r1.py scripts/reconcile_runtime_observation_write_r1.py

      - name: Ethereon terminology guard
        run: python scripts/ethereon_terminology_guard_r1.py

      - name: Reconcile repository truth surfaces
        run: python scripts/repository_truth_reconciliation_gate_r1.py

      - name: Public website surface sea trial
        run: python scripts/sea_trials_website_public_surface_r1.py

      - name: Host alignment trial
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/install
        run: python sea_trials_host_alignment_r1.py

      - name: Core sea trials
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime
        run: |
          python sea_trials_set_one_r1_merged.py
          python sea_trials_psi42_frequency_probe_r1.py
          python sea_trials_context_bundle_repo_truth_r1.py
          python sea_trials_lumina_return_host_r1.py
          python sea_trials_stationary_habitation_cold_return_r1.py
          python sea_trials_lumina_weather_snapshot_idempotence_r1.py
          python sea_trials_runtime_memory_ledger_idempotence_r1.py
          python sea_trials_windows_return_host_path_budget_r1.py
          python sea_trials_resonant_manifold_r1.py
          python sea_trials_resonant_field_reveal_r1.py
          python sea_trials_resonant_field_reveal_sample_r1.py
          python sea_trials_living_framework_chamber_r1.py
          python sea_trials_living_framework_ignition_r1.py
          python sea_trials_lumina_ai_orientation_protocol_r1.py
          python sea_trials_canon_readiness_r2.py

      - name: Preserve canon-readiness R2 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-readiness-r2-receipt-${{ github.sha }}
          path: .lumina_state/ship_of_ethereon_v2/sea_trials_canon_readiness_r2/sea_trials_canon_readiness_r2_receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Bridge sea trials
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2
        run: |
          python sea_trials_lumina_bridge_r1.py
          python sea_trials_lumina_bridge_field_r1.py
          python studio/sea_trials_lumina_bridge_browser_boundary_r2.py

      - name: Studio diagnostics sea trial
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2
        run: python sea_trials_lumina_studio_diagnostics_r1.py

      - name: Host command smoke checks
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2
        run: |
          python bin/lumina --help
          python bin/lumina-bridge --help
          python bin/lumina doctor --json
          python bin/lumina project list --json
          python bin/lumina session list --json

      - name: Verify no tracked local state
        run: |
          tracked=$(git ls-files .lumina_state)
          if [ -n "$tracked" ]; then
            echo "Tracked local Lumina state is not allowed."
            echo "$tracked"
            exit 1
          fi

name: Lumina DryDock Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/**"
      - "LuminaOS/adapters/harmonic_reflection_adapter/examples/**"
      - "deploy/ubuntu_server_lts/**"
      - "deploy/windows_desktop_r1/**"
      - "docs/ACTIVE_SURFACE_REGISTRY_R1.json"
      - "docs/ARTIFACT_TRUTH_CONTRACT.md"
      - "docs/LUMINA_WINDOWS_*.md"
      - "CURRENT_OPERATING_MAP.md"
      - "START_HERE_LUMINA_OS.md"
      - "*.html"
      - "sitemap.xml"
      - "scripts/repository_truth_reconciliation_gate_r1.py"
      - ".github/workflows/lumina-drydock-gate.yml"
  push:
    branches: [main]
    paths:
      - "LuminaOS/bootstrap/Ship_of_Ethereon_V2/**"
      - "LuminaOS/adapters/harmonic_reflection_adapter/examples/**"
      - "deploy/ubuntu_server_lts/**"
      - "deploy/windows_desktop_r1/**"
      - "docs/ACTIVE_SURFACE_REGISTRY_R1.json"
      - "docs/ARTIFACT_TRUTH_CONTRACT.md"
      - "docs/LUMINA_WINDOWS_*.md"
      - "CURRENT_OPERATING_MAP.md"
      - "START_HERE_LUMINA_OS.md"
      - "*.html"
      - "sitemap.xml"
      - "scripts/repository_truth_reconciliation_gate_r1.py"
      - ".github/workflows/lumina-drydock-gate.yml"

permissions:
  contents: write

jobs:
  lumina-drydock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TEMP_APPLY_BEGIN
      - name: Apply truth-channel transformation
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/apply_drydock_truth_channel_hardening_r1.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lumina-drydock-gate.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          output = []
          skipping = False
          markers = {
              '# TEMP_APPLY_BEGIN': True,
              '# TEMP_APPLY_END': False,
              '# TEMP_COMMIT_BEGIN': True,
              '# TEMP_COMMIT_END': False,
          }
          for line in lines:
              stripped = line.strip()
              if stripped in markers:
                  skipping = markers[stripped]
                  continue
              if not skipping:
                  output.append(line)
          text = ''.join(output)
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          text = text.replace(
              '      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          ref: ${{ github.head_ref || github.ref_name }}\n',
              '      - name: Checkout\n        uses: actions/checkout@v4\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      # TEMP_APPLY_END

      - name: Compile Lumina Python
        run: python -m compileall -q LuminaOS/bootstrap/Ship_of_Ethereon_V2 scripts/repository_truth_reconciliation_gate_r1.py

      - name: Reconcile repository truth surfaces
        run: python scripts/repository_truth_reconciliation_gate_r1.py

      - name: Host alignment trial
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/install
        run: python sea_trials_host_alignment_r1.py

      - name: Core sea trials
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2/runtime
        run: |
          python sea_trials_set_one_r1_merged.py
          python sea_trials_lumina_return_host_r1.py
          python sea_trials_windows_return_host_path_budget_r1.py
          python sea_trials_resonant_manifold_r1.py
          python sea_trials_resonant_field_reveal_r1.py
          python sea_trials_resonant_field_reveal_sample_r1.py
          python sea_trials_living_framework_chamber_r1.py
          python sea_trials_living_framework_ignition_r1.py
          if [ -f sea_trials_canon_readiness_r2.py ]; then
            python sea_trials_canon_readiness_r2.py
          fi

      - name: Bridge sea trials
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2
        run: |
          python sea_trials_lumina_bridge_r1.py
          python sea_trials_lumina_bridge_field_r1.py

      - name: Host command smoke checks
        working-directory: LuminaOS/bootstrap/Ship_of_Ethereon_V2
        run: |
          python bin/lumina --help
          python bin/lumina-bridge --help
          python bin/lumina doctor --json
          python bin/lumina project list --json
          python bin/lumina session list --json

      - name: Verify no tracked local state
        run: |
          tracked=$(git ls-files .lumina_state)
          if [ -n "$tracked" ]; then
            echo "Tracked local Lumina state is not allowed."
            echo "$tracked"
            exit 1
          fi

      # TEMP_COMMIT_BEGIN
      - name: Commit transformed branch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Lumina truth and diagnostics"
          git push origin HEAD:${{ github.head_ref }}
      # TEMP_COMMIT_END
